<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Project Gaara — Brainmap</title>
<style>
  :root {
    --bg: #0e0f12;
    --grid: rgba(255,255,255,0.04);
    --grid-strong: rgba(255,255,255,0.08);
    --card-bg: #1a1c22;
    --card-text: #e6e8eb;
    --card-muted: #9ba1ac;
    --border: rgba(255,255,255,0.08);
    --accent: #f0a500;

    --catA: #f0a500;  /* Origin & conviction */
    --catB: #3a8dff;  /* Empirical proofs */
    --catC: #a86bff;  /* Architecture */
    --catD: #ec4899;  /* Cultural anchors */
    --catE: #22c55e;  /* Visions */
    --catF: #f97316;  /* Contrasts */
    --catG: #6b7280;  /* Caveats */
    --catH: #14b8a6;  /* Demos */
    --catI: #f5f5f5;  /* Quotes */
    --catJ: #c9a36b;  /* Artifacts */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--card-text); font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }

  /* Toolbar */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px; background: rgba(14,15,18,0.85);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    z-index: 1000;
  }
  #toolbar h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.02em; opacity: 0.9; }
  #toolbar h1 span { color: var(--accent); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--card-muted); }
  .legend-dot { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .spacer { flex: 1; }
  .btn {
    background: transparent; color: var(--card-text); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.18); }
  .btn-primary { background: var(--accent); color: #0e0f12; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: #ffb820; }

  /* Canvas */
  #canvas-wrap {
    position: absolute; top: 56px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      linear-gradient(var(--grid-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px);
    background-size: 30px 30px, 30px 30px, 150px 150px, 150px 150px;
    cursor: grab;
  }
  #canvas-wrap.panning { cursor: grabbing; }
  #canvas {
    position: absolute;
    width: 6000px;
    height: 4000px;
    transform-origin: 0 0;
  }

  /* Cards */
  .card {
    position: absolute;
    min-width: 140px; min-height: 60px;
    padding: 10px 12px 12px 14px;
    background: var(--card-bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--catA);
    box-shadow: 0 6px 22px rgba(0,0,0,0.35);
    cursor: grab;
    user-select: none;
    overflow: hidden;
  }
  .card.dragging { cursor: grabbing; box-shadow: 0 14px 36px rgba(0,0,0,0.55); z-index: 9999 !important; opacity: 0.96; }
  .card .cat-badge {
    display: inline-block;
    font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--card-muted); text-transform: uppercase;
    margin-bottom: 4px;
  }
  .card .title {
    font-size: 13px; font-weight: 600; margin: 0; line-height: 1.3;
    color: var(--card-text);
  }
  .card .body {
    font-size: 11px; color: var(--card-muted); margin-top: 5px;
    line-height: 1.4;
  }
  .card .resize-handle {
    position: absolute; right: 0; bottom: 0;
    width: 14px; height: 14px;
    cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.18) 50%);
    border-bottom-right-radius: 8px;
  }
  .card.cat-A { border-left-color: var(--catA); }
  .card.cat-B { border-left-color: var(--catB); }
  .card.cat-C { border-left-color: var(--catC); }
  .card.cat-D { border-left-color: var(--catD); }
  .card.cat-E { border-left-color: var(--catE); }
  .card.cat-F { border-left-color: var(--catF); }
  .card.cat-G { border-left-color: var(--catG); }
  .card.cat-H { border-left-color: var(--catH); }
  .card.cat-I { border-left-color: var(--catI); }
  .card.cat-J { border-left-color: var(--catJ); }

  /* Quotes get italic + serif */
  .card.cat-I .title { font-family: "Iowan Old Style", "Palatino", Georgia, serif; font-style: italic; font-weight: 500; }
  .card.cat-I .body { display: none; }

  /* Toast / status */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.96); color: #0e0f12;
    padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity 0.2s ease;
    pointer-events: none; z-index: 2000;
  }
  #toast.show { opacity: 1; }

  /* Help overlay */
  #help {
    position: fixed; bottom: 24px; right: 24px;
    background: rgba(26,28,34,0.92); border: 1px solid var(--border);
    padding: 14px 16px; border-radius: 8px;
    font-size: 11px; color: var(--card-muted); line-height: 1.7;
    max-width: 240px;
    backdrop-filter: blur(8px);
    z-index: 500;
  }
  #help kbd { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; font-size: 10px; color: var(--card-text); }
</style>
</head>
<body>

<div id="toolbar">
  <h1>Project Gaara · <span>Brainmap</span></h1>
  <div class="legend">
    <span class="legend-dot" style="color:var(--catA)">Origin</span>
    <span class="legend-dot" style="color:var(--catB)">Empirical</span>
    <span class="legend-dot" style="color:var(--catC)">Architecture</span>
    <span class="legend-dot" style="color:var(--catD)">Cultural</span>
    <span class="legend-dot" style="color:var(--catE)">Vision</span>
    <span class="legend-dot" style="color:var(--catF)">Contrast</span>
    <span class="legend-dot" style="color:var(--catG)">Caveat</span>
    <span class="legend-dot" style="color:var(--catH)">Demo</span>
    <span class="legend-dot" style="color:var(--catI)">Quote</span>
    <span class="legend-dot" style="color:var(--catJ)">Artifact</span>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btn-reset">Reset layout</button>
  <button class="btn" id="btn-fit">Fit view</button>
  <button class="btn btn-primary" id="btn-copy">Copy layout (JSON)</button>
</div>

<div id="canvas-wrap">
  <div id="canvas"></div>
</div>

<div id="toast"></div>

<div id="help">
  <strong style="color:var(--card-text)">Controls</strong><br>
  <kbd>drag</kbd> a card to move<br>
  <kbd>corner</kbd> to resize (= significance)<br>
  <kbd>drag empty</kbd> space to pan<br>
  <kbd>scroll</kbd> to zoom<br>
  <kbd>copy JSON</kbd> to share with Claude
</div>

<script>
// === COMPONENT INVENTORY ===
const COMPONENTS = [
  // A. Origin & conviction
  { id:'gaara_seed', cat:'A', title:'The Gaara seed', body:'Japanese fantasy as a theory of intelligence' },
  { id:'thesis_sentence', cat:'A', title:'Thesis sentence', body:'Anduril builds drones that obey commands at scale. We prototype agents that interpret service.' },
  { id:'reframe_moment', cat:'A', title:'The reframe', body:'From "best swarm defender" to "build a relationship"' },
  { id:'doraemon_model', cat:'A', title:'The Doraemon model', body:'Care from observation, not instruction' },
  { id:'automata_framing', cat:'A', title:'Automata', body:'Materials that move because they decided to' },

  // B. Empirical proofs
  { id:'convergent_intent', cat:'B', title:'Convergent intent finding', body:'5 runs across 3 interfaces — particles independently reference same coordinate (16.6, 4.2)' },
  { id:'menu_stampede', cat:'B', title:'Menu-bias stampede', body:'19/20 particles all chose up-right (replicated 2×)' },
  { id:'targetpoint_success', cat:'B', title:'Target-point success', body:'3 runs hit max coverage 1.00 — attack-swarm enveloped threat' },
  { id:'paired_ablation', cat:'B', title:'The paired ablation', body:'menu_4dir / menu_8dir / target_point under identical conditions' },
  { id:'scenario_portfolio', cat:'B', title:'7-scenario portfolio', body:'scarcity, decoy, pulse, stealth, dual_mothership, escape, predator_prey' },
  { id:'intent_log', cat:'B', title:'Intent log', body:'Per-particle natural-language reasoning, every step' },

  // C. Architecture
  { id:'three_layers', cat:'C', title:'Three-layer split', body:'Observation → Interpretation → Transmission' },
  { id:'targetpoint_interface', cat:'C', title:'Continuous-intent interface', body:'LLM names a point; deterministic translator picks the direction' },
  { id:'nine_line_translator', cat:'C', title:'9-line translator', body:'Sign of axes, lookup in a table. The whole motor layer.' },
  { id:'identity_conditioning', cat:'C', title:'Identity-conditioning', body:'"You are a guardian warrior" — the only behavioral input' },
  { id:'subject_centered', cat:'C', title:'Subject-centered architecture', body:'Subject at the center, not the operator' },
  { id:'brain_body_analogy', cat:'C', title:'Brain → body analogy', body:'"I want to drink water" → arm muscles' },

  // D. Cultural anchors
  { id:'karakuri', cat:'D', title:'Karakuri ningyō', body:'Edo-period Japanese mechanical dolls' },
  { id:'astro_boy', cat:'D', title:'Astro Boy / Tezuka', body:'Robot with a heart, postwar Japanese imagination' },
  { id:'doraemon', cat:'D', title:'Doraemon', body:'Care-driven AI, friendship as architecture' },
  { id:'shinto_animism', cat:'D', title:'Shinto / animism', body:'Kami living in all things, including machines' },
  { id:'five_fields', cat:'D', title:'5-fields intersection', body:'More-than-human design · Convivial AI · Care robotics · Animist robotics · MIT AHA' },
  { id:'cultural_distinction', cat:'D', title:'Cultural distinction', body:'Japanese AI tradition vs Western "AI as tool"' },

  // E. Visions
  { id:'aquarium_biome', cat:'E', title:'Aquarium biome', body:'LLM swarm caretaking heterogeneous creatures' },
  { id:'tomorrowland', cat:'E', title:'Tomorrowland garden city', body:'Hybrid stack: control-AI infrastructure + relational-AI gardener' },
  { id:'tenders_wanderers', cat:'E', title:'Tenders & Wanderers', body:'Multi-subject park scenario with autonomous wanderers' },
  { id:'lightbulb_identity', cat:'E', title:'Light bulb with identity', body:'Non-humanoid object as relational presence' },
  { id:'live_installations', cat:'E', title:'Live reactive installations', body:'Environments that interpret rather than respond' },
  { id:'spacedata_partnership', cat:'E', title:'Digital twin partnership', body:'Your inhabitants for SpaceData\'s worlds' },

  // F. Contrasts
  { id:'anduril_vs_gaara', cat:'F', title:'Anduril vs Gaara', body:'Command tree vs constellation' },
  { id:'stampede_vs_constellation', cat:'F', title:'Stampede vs constellation', body:'Same destination, mechanical vs chosen paths' },
  { id:'guardian_vs_gardener', cat:'F', title:'Guardian vs gardener', body:'Protect one vs tend many' },
  { id:'engagement_vs_care', cat:'F', title:'Engagement vs care', body:'Moving toward vs improving outcomes' },
  { id:'optimization_vs_presence', cat:'F', title:'Optimization vs presence', body:'The eldercare-AI tension we share with that field' },
  { id:'training_vs_interpretation', cat:'F', title:'Training vs interpretation', body:'MARL paradigm vs LLM paradigm' },
  { id:'tool_vs_participant', cat:'F', title:'Tool vs participant', body:'The deepest paradigm split' },

  // G. Caveats
  { id:'necessary_not_sufficient', cat:'G', title:'Necessary, not sufficient', body:'Architecture removes bias but doesn\'t guarantee strong behavior' },
  { id:'engagement_neq_care', cat:'G', title:'Engagement ≠ care', body:'We showed engagement; care is next to prove' },
  { id:'anthropomorphism', cat:'G', title:'Anthropomorphism risk', body:'LLMs project human feelings onto non-verbal subjects' },
  { id:'paternalism', cat:'G', title:'Paternalism risk', body:'Gardener becoming parent' },
  { id:'no_fitness_function', cat:'G', title:'No fitness function', body:'Validation must be structural, not outcome-based' },
  { id:'surveillance_tension', cat:'G', title:'Surveillance vs observation', body:'Privacy-preserving sensing is open' },

  // H. Demos
  { id:'live_simulation', cat:'H', title:'Live simulation', body:'Particles converging in real time' },
  { id:'intent_browser', cat:'H', title:'Intent-text browser', body:'Hover-to-reveal what each particle was thinking' },
  { id:'before_after_fix', cat:'H', title:'Before/after architectural fix', body:'Toggle menu vs target-point, watch difference' },
  { id:'convergence_visualizer', cat:'H', title:'Convergence visualizer', body:'5 runs, 3 interfaces, all aiming at the same point' },
  { id:'role_toggle', cat:'H', title:'Role toggle', body:'Same architecture, switch guardian → gardener' },
  { id:'scenario_playthroughs', cat:'H', title:'Scenario playthroughs', body:'Each scenario as a small playable scene' },

  // I. Quotes
  { id:'q_service_no_command', cat:'I', title:'"Service without command."' },
  { id:'q_convergence_upstream', cat:'I', title:'"Convergence is upstream of the interface."' },
  { id:'q_architecture_relationship', cat:'I', title:'"The architecture you live with becomes the relationship you can have."' },
  { id:'q_drones_vs_presences', cat:'I', title:'"Anduril builds drones. We prototype presences."' },
  { id:'q_live_in_tomorrowland', cat:'I', title:'"Not building Tomorrowland. Prototyping the kind of intelligence that could live in it."' },
  { id:'q_environment_as_data', cat:'I', title:'"Most AI design treats the environment as data. Our principle inverts this."' },

  // J. Artifacts
  { id:'findings_md', cat:'J', title:'FINDINGS.md', body:'The project\'s documented findings' },
  { id:'report_v1', cat:'J', title:'REPORT.md (target_point v1)', body:'Deep walkthrough of the breakthrough run' },
  { id:'journal_anduril', cat:'J', title:'Journal · Anduril → Caretaker', body:'Where this project sits in the wider AI landscape' },
  { id:'journal_collective', cat:'J', title:'Journal · One subject → Collective', body:'Extending architecture to multiple subjects' },
  { id:'viewer_brief', cat:'J', title:'3D Viewer brief', body:'Spec for an interactive playback environment' },
  { id:'saved_simulations', cat:'J', title:'saved_simulations/', body:'Raw run data — positions, intents, frames' },
];

const STORAGE_KEY = 'gaara_brainmap_v1';

// === STATE ===
const canvas = document.getElementById('canvas');
const wrap = document.getElementById('canvas-wrap');
const toast = document.getElementById('toast');

let view = { x: 0, y: 0, scale: 1 };
let cards = []; // {id, cat, title, body, x, y, w, h, z}
let zCounter = 1;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
}

function applyTransform() {
  canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
}

// === INITIAL LAYOUT ===
function defaultLayout() {
  // Group by category, position in tidy columns at the top
  const cols = {}; // cat -> count
  const COL_W = 250;
  const COL_GAP = 30;
  const ROW_H = 110;
  const START_X = 200;
  const START_Y = 200;
  const CATS = ['A','B','C','D','E','F','G','H','I','J'];
  const CAT_INDEX = Object.fromEntries(CATS.map((c,i)=>[c,i]));

  return COMPONENTS.map(c => {
    const col = CAT_INDEX[c.cat];
    const row = (cols[c.cat] = (cols[c.cat] || 0) + 1) - 1;
    return {
      ...c,
      x: START_X + col * (COL_W + COL_GAP),
      y: START_Y + row * ROW_H,
      w: 220,
      h: 95,
      z: ++zCounter,
    };
  });
}

function loadLayout() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return defaultLayout();
  try {
    const obj = JSON.parse(saved);
    if (!obj.cards) return defaultLayout();
    // Merge — if new components were added since save, append them
    const savedIds = new Set(obj.cards.map(c => c.id));
    const merged = obj.cards.map(s => {
      const def = COMPONENTS.find(c => c.id === s.id);
      return def ? { ...def, ...s } : s;
    });
    COMPONENTS.forEach(c => {
      if (!savedIds.has(c.id)) {
        merged.push({ ...c, x: 100 + Math.random()*200, y: 100 + Math.random()*200, w:220, h:95, z: ++zCounter });
      }
    });
    if (obj.view) view = obj.view;
    return merged;
  } catch (e) {
    return defaultLayout();
  }
}

function saveLayout() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards, view }));
}

// === RENDERING ===
function renderAll() {
  canvas.innerHTML = '';
  cards.forEach(c => renderCard(c));
  applyTransform();
}

function renderCard(c) {
  const el = document.createElement('div');
  el.className = `card cat-${c.cat}`;
  el.id = `card-${c.id}`;
  el.style.left = `${c.x}px`;
  el.style.top = `${c.y}px`;
  el.style.width = `${c.w}px`;
  el.style.height = `${c.h}px`;
  el.style.zIndex = c.z;

  const catNames = {A:'Origin', B:'Empirical', C:'Architecture', D:'Cultural', E:'Vision', F:'Contrast', G:'Caveat', H:'Demo', I:'Quote', J:'Artifact'};
  el.innerHTML = `
    <div class="cat-badge">${catNames[c.cat]}</div>
    <div class="title"></div>
    ${c.body ? '<div class="body"></div>' : ''}
    <div class="resize-handle"></div>
  `;
  el.querySelector('.title').textContent = c.title;
  if (c.body) el.querySelector('.body').textContent = c.body;

  attachCardHandlers(el, c);
  canvas.appendChild(el);
}

// === DRAG / RESIZE ===
function attachCardHandlers(el, card) {
  let dragMode = null; // 'move' | 'resize'
  let start = null;

  el.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const isResize = e.target.classList.contains('resize-handle');
    dragMode = isResize ? 'resize' : 'move';
    start = {
      mx: e.clientX, my: e.clientY,
      cx: card.x, cy: card.y, cw: card.w, ch: card.h,
    };
    card.z = ++zCounter;
    el.style.zIndex = card.z;
    el.classList.add('dragging');
    e.stopPropagation();
    e.preventDefault();
  });

  function onMove(e) {
    if (!dragMode || !start) return;
    const dx = (e.clientX - start.mx) / view.scale;
    const dy = (e.clientY - start.my) / view.scale;
    if (dragMode === 'move') {
      card.x = start.cx + dx;
      card.y = start.cy + dy;
      el.style.left = `${card.x}px`;
      el.style.top = `${card.y}px`;
    } else {
      card.w = Math.max(140, start.cw + dx);
      card.h = Math.max(60, start.ch + dy);
      el.style.width = `${card.w}px`;
      el.style.height = `${card.h}px`;
    }
  }
  function onUp() {
    if (dragMode) {
      el.classList.remove('dragging');
      dragMode = null;
      saveLayout();
    }
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// === PAN / ZOOM ===
let panStart = null;
wrap.addEventListener('mousedown', (e) => {
  if (e.target !== wrap && e.target !== canvas) return;
  panStart = { mx: e.clientX, my: e.clientY, vx: view.x, vy: view.y };
  wrap.classList.add('panning');
});
document.addEventListener('mousemove', (e) => {
  if (!panStart) return;
  view.x = panStart.vx + (e.clientX - panStart.mx);
  view.y = panStart.vy + (e.clientY - panStart.my);
  applyTransform();
});
document.addEventListener('mouseup', () => {
  if (panStart) { panStart = null; wrap.classList.remove('panning'); saveLayout(); }
});

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const oldScale = view.scale;
  const scaleFactor = e.deltaY > 0 ? 0.92 : 1.08;
  const newScale = Math.max(0.2, Math.min(2.5, oldScale * scaleFactor));
  // zoom around cursor
  view.x = mx - (mx - view.x) * (newScale / oldScale);
  view.y = my - (my - view.y) * (newScale / oldScale);
  view.scale = newScale;
  applyTransform();
  saveLayout();
}, { passive: false });

// === BUTTONS ===
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Reset all positions and sizes?')) return;
  localStorage.removeItem(STORAGE_KEY);
  cards = defaultLayout();
  view = { x: 0, y: 0, scale: 1 };
  renderAll();
  saveLayout();
  showToast('Reset to default layout');
});

document.getElementById('btn-fit').addEventListener('click', () => {
  // Fit all cards in view
  if (cards.length === 0) return;
  const minX = Math.min(...cards.map(c => c.x)) - 50;
  const minY = Math.min(...cards.map(c => c.y)) - 50;
  const maxX = Math.max(...cards.map(c => c.x + c.w)) + 50;
  const maxY = Math.max(...cards.map(c => c.y + c.h)) + 50;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const sX = w / (maxX - minX);
  const sY = h / (maxY - minY);
  view.scale = Math.min(sX, sY, 1);
  view.x = -minX * view.scale + (w - (maxX - minX) * view.scale) / 2;
  view.y = -minY * view.scale + (h - (maxY - minY) * view.scale) / 2;
  applyTransform();
  saveLayout();
});

document.getElementById('btn-copy').addEventListener('click', () => {
  // Compact JSON for sharing
  const out = cards.map(c => ({
    id: c.id, cat: c.cat, title: c.title,
    x: Math.round(c.x), y: Math.round(c.y),
    w: Math.round(c.w), h: Math.round(c.h),
  }));
  // Sort by visual significance (size) to put dominant cards first
  out.sort((a, b) => (b.w * b.h) - (a.w * a.h));
  const json = JSON.stringify(out, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    showToast('Layout copied — paste into chat with Claude');
  });
});

// === BOOT ===
cards = loadLayout();
zCounter = Math.max(...cards.map(c => c.z || 1), 1);
renderAll();

// Initial centering
if (!localStorage.getItem(STORAGE_KEY)) {
  view = { x: -100, y: -100, scale: 0.85 };
  applyTransform();
}
</script>

</body>
</html>
