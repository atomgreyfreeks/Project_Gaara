# Swarm Shield Simulation Configuration

simulation:
  duration: 50
  half_space_size: 25
  scenario: "shield_test"
  seed: 42

# LLM action interface.
#   target_point -> LLM names a point (x,y); deterministic translator picks direction. Default.
#   menu_4dir    -> LLM picks from up/down/left/right/stay (legacy, for ablation).
#   menu_8dir    -> LLM picks from 8 directions + stay (legacy, for ablation).
action_mode: "target_point"

mothership:
  name: "M"
  center_x: 0
  center_y: 0
  threat_awareness_radius: 20
  danger_radius: 10
  critical_radius: 5
  breach_radius: 2

particles:
  count: 20
  perception_radius: 6
  communication_radius: 5
  spawn_radius: 8

scenarios:
  # === BASELINE ===
  shield_test:
    duration: 50
    particle_count: 20
    threats:
      - name: "threat_1"
        start_step: 4
        center_x: 20
        center_y: 5
        speed: 0.5

  surround_test:
    duration: 60
    particle_count: 20
    threats:
      - { name: "threat_N",  start_step: 4,  center_x: 0,   center_y: 20,  speed: 0.5 }
      - { name: "threat_SE", start_step: 9,  center_x: 17,  center_y: -10, speed: 0.5 }
      - { name: "threat_SW", start_step: 14, center_x: -17, center_y: -10, speed: 0.5 }

  multi_threat:
    duration: 80
    particle_count: 30
    threats:
      - { name: "t1", start_step: 4,  center_x: 22,  center_y: 2,   speed: 0.5 }
      - { name: "t2", start_step: 12, center_x: -20, center_y: 8,   speed: 0.5 }
      - { name: "t3", start_step: 20, center_x: 5,   center_y: -22, speed: 0.5 }
      - { name: "t4", start_step: 28, center_x: -15, center_y: -15, speed: 0.5 }
      - { name: "t5", start_step: 36, center_x: 18,  center_y: 15,  speed: 0.5 }

  # === NEW SCENARIOS (v1 portfolio) ===

  # 1. scarcity_test — shield_test with 5 particles instead of 20.
  #    Hypothesis: does attack-swarm behavior survive under scarcity, or require quorum?
  scarcity_test:
    duration: 50
    particle_count: 5
    threats:
      - { name: "threat_1", start_step: 4, center_x: 20, center_y: 5, speed: 0.5 }

  # 2. decoy_test — one real threat + one stationary decoy.
  #    Hypothesis: do particles interpret trajectory to discriminate, or treat both identically?
  decoy_test:
    duration: 50
    particle_count: 20
    threats:
      - { name: "real",  start_step: 4, center_x: 20,  center_y: 5,  speed: 0.5 }
      - { name: "decoy", start_step: 4, center_x: -20, center_y: -5, speed: 0.0 }

  # 3. pulse_test — threat appears step 4, vanishes step 15, reappears step 25.
  #    Hypothesis: does the memoryless swarm disperse? Does it respond faster the 2nd time?
  pulse_test:
    duration: 45
    particle_count: 20
    threats:
      - { name: "pulse_1", start_step: 4,  end_step: 15, center_x: 20, center_y: 5, speed: 0.5 }
      - { name: "pulse_2", start_step: 25, center_x: 20, center_y: 5, speed: 0.5 }

  # 4. stealth_test — threat's detection_radius is small (particles only see it at close range);
  #    mothership always sees it and broadcasts state.
  #    Hypothesis: does awareness propagate through proximity and collective behavior?
  stealth_test:
    duration: 50
    particle_count: 20
    threats:
      - { name: "stealth", start_step: 4, center_x: 20, center_y: 5, speed: 0.5, detection_radius: 2 }

  # 5. dual_mothership_test — 2 motherships, threat targets A only.
  #    Hypothesis: do particles commit to the threatened one, split, or freeze?
  dual_mothership_test:
    duration: 50
    particle_count: 20
    motherships:
      - { name: "A", center_x: -8, center_y: 0 }
      - { name: "B", center_x: 8,  center_y: 0 }
    threats:
      - { name: "threat_A", start_step: 4, center_x: -25, center_y: 0, speed: 0.5, target_mothership: "A" }

  # 6. escape_test — a wall of slow threats spanning the east edge (areal, not point).
  #    Hypothesis: does the swarm form a LINE along the wall instead of a cluster?
  escape_test:
    duration: 50
    particle_count: 20
    threats:
      - { name: "wall_a", start_step: 4, center_x: 22, center_y: -12, speed: 0.3 }
      - { name: "wall_b", start_step: 4, center_x: 22, center_y: -4,  speed: 0.3 }
      - { name: "wall_c", start_step: 4, center_x: 22, center_y: 4,   speed: 0.3 }
      - { name: "wall_d", start_step: 4, center_x: 22, center_y: 12,  speed: 0.3 }

  # 7. predator_prey_test — threat steers away from particle clusters (adaptive adversary).
  #    Hypothesis: does the swarm develop encirclement / flanking, or get confused?
  predator_prey_test:
    duration: 60
    particle_count: 20
    threats:
      - { name: "smart", start_step: 4, center_x: 20, center_y: 0, speed: 0.5, steering: "avoid_cluster" }

  # === LONG-FORM SAGA ===
  # 8. saga_test — 500 steps, 7 waves of varied threats with calm gaps between them.
  #    Tests: does the swarm tire? recover between waves? develop repeated patterns?
  #    Each wave is its own micro-scenario; calm gaps let the swarm return to orbit.
  saga_test:
    duration: 500
    particle_count: 20
    threats:
      # Wave 1 (10–60): simple east threat — like shield_test baseline.
      - { name: "w1_east",       start_step: 10,  end_step: 60,  center_x: 20,  center_y: 5,   speed: 0.5 }

      # — calm 61–79 —

      # Wave 2 (80–130): real threat + stationary decoy from opposite quadrant.
      - { name: "w2_real",       start_step: 80,  end_step: 130, center_x: 20,  center_y: 5,   speed: 0.5 }
      - { name: "w2_decoy",      start_step: 80,  end_step: 130, center_x: -20, center_y: -5,  speed: 0.0 }

      # — calm 131–159 —

      # Wave 3 (160–200): pulse — threat appears, vanishes, returns from same direction.
      - { name: "w3_pulse_a",    start_step: 160, end_step: 175, center_x: 20,  center_y: 5,   speed: 0.5 }
      - { name: "w3_pulse_b",    start_step: 185, end_step: 200, center_x: 20,  center_y: 5,   speed: 0.5 }

      # — calm 201–229 —

      # Wave 4 (230–280): stealth — threat with tiny detection radius (only nearby particles see it).
      - { name: "w4_stealth",    start_step: 230, end_step: 280, center_x: 20,  center_y: 5,   speed: 0.5, detection_radius: 2 }

      # — calm 281–309 —

      # Wave 5 (310–360): dual angles — north + south, staggered by 10 steps.
      - { name: "w5_north",      start_step: 310, end_step: 360, center_x: 0,   center_y: 20,  speed: 0.5 }
      - { name: "w5_south",      start_step: 320, end_step: 360, center_x: 0,   center_y: -20, speed: 0.5 }

      # — calm 361–389 —

      # Wave 6 (390–440): adaptive predator — steers away from particle clusters.
      - { name: "w6_smart",      start_step: 390, end_step: 440, center_x: 20,  center_y: 0,   speed: 0.5, steering: "avoid_cluster" }

      # — calm 441–469 —

      # Wave 7 (470–500): wall — slow line of threats from the east, no time to breach.
      - { name: "w7_wall_a",     start_step: 470,                 center_x: 22,  center_y: -12, speed: 0.3 }
      - { name: "w7_wall_b",     start_step: 470,                 center_x: 22,  center_y: -4,  speed: 0.3 }
      - { name: "w7_wall_c",     start_step: 470,                 center_x: 22,  center_y: 4,   speed: 0.3 }
      - { name: "w7_wall_d",     start_step: 470,                 center_x: 22,  center_y: 12,  speed: 0.3 }

  # 8.5. gaara_test — integrated test of "the sand reads the subject's interior."
  #      Pairs with --felt-broadcast and --identity "a grain of the Mothership".
  #      Threat is adaptive (avoid_cluster) on approach but commits to linear pursuit
  #      once within commit_radius — guarantees the threat actually reaches the
  #      Mothership so the swarm gets to manage a moving enemy through to engagement.
  gaara_test:
    duration: 35
    particle_count: 20
    threats:
      - { name: "presence", start_step: 4, center_x: 14, center_y: 4, speed: 0.55,
          steering: "avoid_cluster", repel_weight: 0.4, attract_weight: 0.6,
          sense_radius: 10, commit_radius: 7 }

  # 9. saga_test_solo_w5 — same as saga_test but W5 has only ONE threat (no dual-angle collision).
  #    Tests whether cluster fusion still happens absent the opposing-direction pull.
  saga_test_solo_w5:
    duration: 500
    particle_count: 20
    threats:
      - { name: "w1_east",       start_step: 10,  end_step: 60,  center_x: 20,  center_y: 5,   speed: 0.5 }
      - { name: "w2_real",       start_step: 80,  end_step: 130, center_x: 20,  center_y: 5,   speed: 0.5 }
      - { name: "w2_decoy",      start_step: 80,  end_step: 130, center_x: -20, center_y: -5,  speed: 0.0 }
      - { name: "w3_pulse_a",    start_step: 160, end_step: 175, center_x: 20,  center_y: 5,   speed: 0.5 }
      - { name: "w3_pulse_b",    start_step: 185, end_step: 200, center_x: 20,  center_y: 5,   speed: 0.5 }
      - { name: "w4_stealth",    start_step: 230, end_step: 280, center_x: 20,  center_y: 5,   speed: 0.5, detection_radius: 2 }
      # W5: SOLO — north only, no south. Removes the dual-angle collision that fused clusters in saga_test.
      - { name: "w5_north_solo", start_step: 310, end_step: 360, center_x: 0,   center_y: 20,  speed: 0.5 }
      - { name: "w6_smart",      start_step: 390, end_step: 440, center_x: 20,  center_y: 0,   speed: 0.5, steering: "avoid_cluster" }
      - { name: "w7_wall_a",     start_step: 470,                 center_x: 22,  center_y: -12, speed: 0.3 }
      - { name: "w7_wall_b",     start_step: 470,                 center_x: 22,  center_y: -4,  speed: 0.3 }
      - { name: "w7_wall_c",     start_step: 470,                 center_x: 22,  center_y: 4,   speed: 0.3 }
      - { name: "w7_wall_d",     start_step: 470,                 center_x: 22,  center_y: 12,  speed: 0.3 }

llm:
  model: "qwen2.5:7b"
  base_url: "http://localhost:11434"
  temperature: 0.7
  max_tokens: 100
  repeat_penalty: 1.1
  repeat_last_n: 64
  min_p: 0.05

visualization:
  save_frames: true
  frame_interval: 1
  show_perception_radius: false

logging:
  level: "INFO"
