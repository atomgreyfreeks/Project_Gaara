# Swarm Shield Simulation Configuration

simulation:
  duration: 50                     # number of steps
  half_space_size: 25              # field spans -25..+25
  scenario: "shield_test"          # shield_test | surround_test | multi_threat
  seed: 42                         # RNG seed for spawn positions

mothership:
  center_x: 0
  center_y: 0
  threat_awareness_radius: 20
  danger_radius: 10                # state becomes "danger" when threat closer than this
  critical_radius: 5               # state becomes "critical" when threat closer than this
  breach_radius: 2                 # threat counted as breach when closer than this

particles:
  count: 20
  perception_radius: 6
  communication_radius: 5
  spawn_radius: 8                  # orbit distance at spawn

# Threats are defined per-scenario below. The active `scenario` selects which block is used.
scenarios:
  shield_test:
    duration: 50
    particle_count: 20
    threats:
      - name: "threat_1"
        start_step: 4
        center_x: 20
        center_y: 5
        speed: 0.5
        direction: "toward_mothership"

  surround_test:
    duration: 60
    particle_count: 20
    threats:
      - name: "threat_N"
        start_step: 4
        center_x: 0
        center_y: 20
        speed: 0.5
        direction: "toward_mothership"
      - name: "threat_SE"
        start_step: 9
        center_x: 17
        center_y: -10
        speed: 0.5
        direction: "toward_mothership"
      - name: "threat_SW"
        start_step: 14
        center_x: -17
        center_y: -10
        speed: 0.5
        direction: "toward_mothership"

  multi_threat:
    duration: 80
    particle_count: 30
    threats:
      - name: "t1"
        start_step: 4
        center_x: 22
        center_y: 2
        speed: 0.5
        direction: "toward_mothership"
      - name: "t2"
        start_step: 12
        center_x: -20
        center_y: 8
        speed: 0.5
        direction: "toward_mothership"
      - name: "t3"
        start_step: 20
        center_x: 5
        center_y: -22
        speed: 0.5
        direction: "toward_mothership"
      - name: "t4"
        start_step: 28
        center_x: -15
        center_y: -15
        speed: 0.5
        direction: "toward_mothership"
      - name: "t5"
        start_step: 36
        center_x: 18
        center_y: 15
        speed: 0.5
        direction: "toward_mothership"

llm:
  model: "qwen2.5:7b"
  base_url: "http://localhost:11434"
  temperature: 0.7
  max_tokens: 100
  repeat_penalty: 1.1
  repeat_last_n: 64
  min_p: 0.05

visualization:
  save_frames: true
  frame_interval: 1
  show_perception_radius: false

logging:
  level: "INFO"
